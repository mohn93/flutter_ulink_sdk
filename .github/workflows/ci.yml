name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The Flutter toolchain is pinned so CI is reproducible. With a floating
# `channel: stable`, a new Flutter/Dart release could silently change
# `dart format` output — failing the format gate on files nobody touched — and
# make `flutter pub get` rewrite analysis_options.yaml, failing the publish
# dry-run on an "unclean git state". Pin to the maintainer's dev version and
# bump it deliberately (reformatting in the same commit) rather than letting it
# drift. Keep this in sync with the Release workflow.

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Dry run publish
        run: |
          # `flutter pub get` can leave tracked files modified on some toolchain
          # versions (a regenerated analysis_options.yaml, pubspec.lock, ...),
          # which pub's publish validation reports as an unclean git state and
          # fails on. Reset to the committed sources so the dry-run validates
          # exactly what will be published.
          git checkout -- .
          dart pub publish --dry-run

  # Compile the plugin's native iOS (Swift) code. The analyze/test/dry-run jobs
  # are Dart-only and never build the Swift, so a plugin Swift compile error can
  # merge and ship undetected (as a UIScene scene-delegate signature mismatch
  # once did). Building the example for a device with --no-codesign compiles the
  # plugin without needing a signing certificate or a simulator destination.
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.5'

      - name: Build example for iOS (compiles the plugin's Swift)
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --no-codesign

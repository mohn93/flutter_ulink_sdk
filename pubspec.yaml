name: flutter_ulink_sdk
description: "Flutter SDK for Ulinkly deep linking: Universal Links, App Links, deferred deep links and attribution. A Firebase Dynamic Links replacement."
version: 0.4.3
homepage: https://ulink.ly/framework/flutter
repository: https://github.com/mohn93/flutter_ulink_sdk
issue_tracker: https://github.com/mohn93/flutter_ulink_sdk/issues
documentation: https://docs.ulink.ly/getting-started/flutter
topics:
  - deep-linking
  - dynamic-links
  - universal-links
  - app-links
  - deferred-deep-linking

environment:
  sdk: ^3.10.0
  # The iOS plugin adopts Flutter's UIScene lifecycle
  # (FlutterSceneLifeCycleDelegate / addSceneDelegate), introduced in 3.38.0.
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_ulink_sdk
        pluginClass: FlutterUlinkSdkPlugin
      ios:
        pluginClass: FlutterUlinkSdkPlugin
